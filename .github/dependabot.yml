# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      # Microsoft.OpenApi 3.9+ changes schema identity and duplicates generated
      # models across large specifications. Keep 3.7 until compatibility is fixed;
      # the OpenAPI Upgrade Canary covers 3.8 and the latest 3.x release.
      - dependency-name: "Microsoft.OpenApi"
      - dependency-name: "Microsoft.OpenApi.YamlReader"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
