openapi: "3.0.0"
info:
  version: 1.0.0
  title: Split By Tags Fixture
  description: |
    Two-tag fixture for split-by-tags package families. Deliberately exercises the parts of the
    generator that have to cross an assembly boundary once the SDK is split:
      - two tags, so the family has two independently consumable tag packages
      - a model shared by both tags, proving shared models belong in Core
      - a model reachable from exactly one tag, so per-tag model ownership has something to move
      - an untagged operation, which is a partial of the root client and must land in the facade
      - OAuth2 security, whose support types are nested in the root client and would otherwise
        make every tag assembly reference the facade that already references it
      - two servers, so the server-selection support type is generated
      - a cursor-paged response, a streaming response, a request body, and a status-polling
        operation, so the pageable / response-stream / request-options / polling runtime helpers
        are all reachable from tag operation bodies
servers:
  - url: https://api.example.com/v1
    description: Production.
  - url: https://sandbox.example.com/v1
    description: Sandbox.
security:
  - oauth2:
      - read
      - write
paths:
  /status:
    get:
      summary: Service status, deliberately untagged.
      operationId: getStatus
      responses:
        '200':
          description: The current service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /albums:
    get:
      summary: List albums.
      operationId: listAlbums
      tags:
        - albums
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of albums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumPage"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an album. Its request body is reachable only from the albums tag.
      operationId: createAlbum
      tags:
        - albums
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumCreate"
      responses:
        '201':
          description: The created album.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
  /albums/{albumId}:
    get:
      summary: Get one album.
      operationId: getAlbum
      tags:
        - albums
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The album.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
  /artists/{artistId}:
    get:
      summary: Get one artist.
      operationId: getArtist
      tags:
        - artists
      parameters:
        - name: artistId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The artist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
  /artists/{artistId}/albums:
    get:
      summary: List an artist's albums. Returns the same Album model the albums tag uses.
      operationId: listArtistAlbums
      tags:
        - artists
      parameters:
        - name: artistId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A page of albums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumPage"
  /artists/{artistId}/portrait:
    get:
      summary: Download an artist portrait as a stream.
      operationId: getArtistPortrait
      tags:
        - artists
      parameters:
        - name: artistId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The portrait bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /artists/imports/{importId}:
    get:
      summary: Get an artist import job. Its status enum drives the generated polling helper.
      operationId: getArtistImport
      tags:
        - artists
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The import job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistImport"
tags:
  - name: albums
    description: Album catalogue operations.
  - name: artists
    description: Artist catalogue operations.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.example.com/oauth/authorize
          tokenUrl: https://api.example.com/oauth/token
          refreshUrl: https://api.example.com/oauth/token
          scopes:
            read: Read access.
            write: Write access.
  schemas:
    Status:
      type: object
      required:
        - healthy
      properties:
        healthy:
          type: boolean
        version:
          type: string
    Album:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        artist:
          $ref: "#/components/schemas/Artist"
    AlbumCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        artistId:
          type: string
    Artist:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    ArtistImport:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        importedCount:
          type: integer
          format: int32
    AlbumPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Album"
        next_cursor:
          type: string
        total:
          type: integer
          format: int32
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
