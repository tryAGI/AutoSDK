openapi: "3.0.0"
info:
  version: 1.0.0
  title: Swagger Petstore
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/by-ids/{petIds}:
    get:
      summary: Info for several pets at once
      description: >-
        An array-typed path parameter, serialized with the OpenAPI simple style: the items are
        joined with commas.
      operationId: showPetsByIds
      tags:
        - pets
      parameters:
        - name: petIds
          in: path
          required: true
          description: The pet ids to look up.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The requested pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/label/{petIds}:
    get:
      summary: Info for several pets, label style
      description: >-
        An array path parameter in the OpenAPI label style with explode, which renders as
        `.a.b` rather than a comma-joined list.
      operationId: showPetsByIdsLabel
      tags:
        - pets
      parameters:
        - name: petIds
          in: path
          required: true
          style: label
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The requested pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
  /pets/matrix/{petIds}:
    get:
      summary: Info for several pets, matrix style
      description: >-
        An array path parameter in the OpenAPI matrix style without explode, which renders as
        `;petIds=a,b`.
      operationId: showPetsByIdsMatrix
      tags:
        - pets
      parameters:
        - name: petIds
          in: path
          required: true
          style: matrix
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The requested pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
  /pets?beta=true:
    get:
      summary: List all pets (beta)
      description: >-
        A spec cannot declare two operations on the same path and method, so the beta variant is
        keyed by a query string and states its real request path with x-autosdk-path.
      operationId: listPetsBeta
      x-autosdk-path: /pets
      tags:
        - pets
      parameters:
        - name: x-beta-features
          in: header
          description: Beta features to enable, sent as one comma-separated header.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /match-named-union:
    get:
      operationId: getMatchNamedUnion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
  /defs-union:
    get:
      operationId: getDefsUnion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefsUnion'
components:
  schemas:
    # A union schema literally named `Match`. The generated matcher is called `Match` too, and C#
    # forbids a member with its enclosing type's name - this shape produced CS0542 and took a whole
    # SDK down. Mistral's filter DSL has one.
    Match:
      oneOf:
        - $ref: '#/components/schemas/MatchEqual'
        - $ref: '#/components/schemas/MatchRange'
    MatchEqual:
      type: object
      required: [equal]
      properties:
        equal:
          type: string
    MatchRange:
      type: object
      required: [rangeFrom]
      properties:
        rangeFrom:
          type: integer
    # A union whose variants live in a JSON Schema `$defs` block, referenced as `#/$defs/...`. Those
    # refs resolve to nothing, so every variant drops out and the union used to render as `AnyOf<>` -
    # never valid C#, CS0305. It falls back to `object` instead.
    DefsUnion:
      anyOf:
        - $ref: '#/$defs/DefsChunk'
        - $ref: '#/$defs/DefsError'
      $defs:
        DefsChunk:
          type: object
          required: [content]
          properties:
            content:
              type: string
        DefsError:
          type: object
          required: [error]
          properties:
            error:
              type: string
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        4:
          type: string
          example: '1234'
        1.5:
          type: boolean
          example: true
        16:9:
          type: boolean
          example: true
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  
  responses:
    4:
      description: A plus 4 extension to postals.
      content:
        text/plain:
          schema:
            type: string
            example: '1234'
