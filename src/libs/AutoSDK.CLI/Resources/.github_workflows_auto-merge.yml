name: Auto-approve and auto-merge bot pull requests
on:
  # This workflow never checks out or executes pull-request code. Using the
  # base-branch definition makes PERSONAL_TOKEN available for Dependabot PRs.
  pull_request_target:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: tryAGI/workflows/.github/workflows/auto-merge.yml@main
    secrets: inherit
