name: Bug report
description: Report a reproducible problem with an SDK or integration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the SDK. Search existing issues first and do not include API keys or other secrets.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem and its impact.
      placeholder: Calling the chat API omits the system role.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Generated API client
        - Authentication
        - Serialization
        - Microsoft.Extensions.AI integration
        - Documentation or examples
        - Other
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: NuGet package version
      description: Provide the exact package version where the problem occurs.
      placeholder: 1.2.3
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      description: Paste the relevant output from `dotnet --version`.
      placeholder: 10.0.100

  - type: input
    id: endpoint-or-model
    attributes:
      label: Endpoint or model
      description: Include the affected API operation or model when applicable.
      placeholder: Chat completions / mistral-small-latest

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample and exact steps that reproduce the problem.
      placeholder: |
        1. Configure the client...
        2. Call the API...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happened, including the complete error message when relevant.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or request/response details
      description: Add sanitized logs, stack traces, or HTTP details. Remove credentials and personal data.
      render: shell

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help diagnose the issue.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed API keys, credentials, and other sensitive data.
          required: true
