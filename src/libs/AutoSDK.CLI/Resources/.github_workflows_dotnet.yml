name: Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v**

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    uses: tryAGI/workflows/.github/workflows/generated-sdk-publish.yml@main
    with:
      project-path: src/libs/$SolutionName$/$SolutionName$.csproj
      auto-stable-release: true
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
