openapi: 3.0.3
info:
  title: NativeAOT example
  version: 1.0.0
servers:
  - url: https://example.com
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetChoice'
  /pet-matches/{petId}:
    get:
      operationId: getPetMatch
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Every pet representation that matches the payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetMatch'
  /surveys/{surveyId}:
    get:
      operationId: getSurvey
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested survey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
components:
  schemas:
    PetMood:
      type: string
      enum:
        - playful
        - sleepy
    Cat:
      type: object
      required:
        - name
        - lives
        - mood
      properties:
        name:
          type: string
        lives:
          type: integer
        mood:
          $ref: '#/components/schemas/PetMood'
    Dog:
      type: object
      required:
        - name
        - bark
        - mood
      properties:
        name:
          type: string
        bark:
          type: string
        mood:
          $ref: '#/components/schemas/PetMood'
    PetChoice:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    PetMatch:
      anyOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    Survey:
      type: object
      required:
        - questions
        - answers
      properties:
        questions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Question'
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Answer'
    Question:
      oneOf:
        - $ref: '#/components/schemas/TextQuestion'
        - $ref: '#/components/schemas/ChoiceQuestion'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextQuestion'
          choice: '#/components/schemas/ChoiceQuestion'
    Answer:
      anyOf:
        - $ref: '#/components/schemas/TextAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextAnswer'
          choice: '#/components/schemas/ChoiceAnswer'
    TextQuestion:
      type: object
      required:
        - type
        - prompt
      properties:
        type:
          type: string
          enum:
            - text
        prompt:
          type: string
    ChoiceQuestion:
      type: object
      required:
        - type
        - prompt
        - options
      properties:
        type:
          type: string
          enum:
            - choice
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
    TextAnswer:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - text
        value:
          type: string
    ChoiceAnswer:
      type: object
      required:
        - type
        - values
      properties:
        type:
          type: string
          enum:
            - choice
        values:
          type: array
          items:
            type: string
