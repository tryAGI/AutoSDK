openapi: 3.0.3
info:
  title: NativeAOT example
  version: 1.0.0
servers:
  - url: https://example.com
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetChoice'
components:
  schemas:
    Cat:
      type: object
      required:
        - name
        - lives
      properties:
        name:
          type: string
        lives:
          type: integer
    Dog:
      type: object
      required:
        - name
        - bark
      properties:
        name:
          type: string
        bark:
          type: string
    PetChoice:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
